name: Verify AIC
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  security:
    uses: ./.github/workflows/security.yml
  offline-contracts:
    needs: security
    if: always()
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Require successful security checks
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
        run: test "$SECURITY_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install declared MCP integration dependencies
        run: python -m pip install ".[mcp]"
      - name: Verify package and isolated contracts
        run: ./scripts/verify.sh
