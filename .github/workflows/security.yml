name: Security checks
on:
  workflow_call:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_ONLY_BINARY: ':all:'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install pinned advisory scanner
        run: |
          python -m pip install --only-binary=:all: 'pip-audit==2.10.1'
      - name: Audit declared runtime, optional and build dependencies
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          data = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          project = data['project']
          requirements = set(data['build-system']['requires']) | set(project.get('dependencies', []))
          for extra in project.get('optional-dependencies', {}).values():
              requirements.update(extra)
          target = Path(os.environ['RUNNER_TEMP']) / 'aic-security-requirements.txt'
          target.write_text('\n'.join(sorted(requirements)) + '\n', encoding='utf-8')
          PY
          python -m pip_audit --requirement "$RUNNER_TEMP/aic-security-requirements.txt" --strict --progress-spinner off
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch checksum-pinned MIT-licensed scanner
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/aic-gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/aic-gitleaks" gitleaks LICENSE
      - name: Scan full reachable history with bundled rules and redacted output
        run: |
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/aic-gitleaks.toml"
          "$RUNNER_TEMP/aic-gitleaks/gitleaks" git . \
            --log-opts='--all --full-history -m' \
            --config "$RUNNER_TEMP/aic-gitleaks.toml" \
            --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow \
            --redact=100 --no-banner --log-level error --timeout 300 \
            --report-format json --report-path "$RUNNER_TEMP/aic-gitleaks.json"
