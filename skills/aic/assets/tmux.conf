# AIC task-owned supervision profile; original configuration for tmux 3.8.
# Read ../references/supervision.md before use. Load only at a NEW private socket
# with an explicitly reviewed -f path. Never source this into an existing server.
# No plugins, shell hooks, automatic job launches, respawns or acceptance claims.

# These server/session defaults affect only the explicitly selected private server.
set-option -s theme dark
set-option -s exit-unattached off
set-option -s exit-empty on
set-option -g destroy-unattached off
set-option -g detach-on-destroy on
set-option -g update-environment ''
set-option -s set-clipboard off
set-option -s get-clipboard off
set-option -g set-titles off

# Keep operator-assigned identities stable; titles are labels, not trusted evidence.
set-option -g base-index 1
set-option -w -g pane-base-index 1
set-option -g renumber-windows off
set-option -w -g automatic-rename off
set-option -w -g allow-rename off
set-option -w -g allow-set-title off
set-option -w -g allow-passthrough off
set-option -w -g synchronize-panes off

# Retain both zero and nonzero exits until the operator accounts for them.
# A live interactive shell stays RUNNING even after a command within it finishes.
set-option -w -g remain-on-exit on
set-option -w -g remain-on-exit-format 'DEAD | #{?pane_dead_signal,signal=#{pane_dead_signal},exit=#{pane_dead_status}} | process ended; task acceptance UNKNOWN until checked'
set-option -g history-limit 10000

# Original dark/slate theme with cyan focus and amber retained exits.
set-option -g status on
set-option -g status 2
set-option -g status-interval 2
set-option -g status-style 'bg=colour235,fg=colour252'
set-option -g message-style 'bg=colour236,fg=colour230'
set-option -w -g mode-style 'bg=colour24,fg=colour231'
set-option -w -g mode-keys emacs
set-option -w -g pane-border-style 'fg=colour240'
set-option -w -g pane-active-border-style 'fg=colour81'
set-option -w -g pane-border-lines single
set-option -w -g pane-border-status top
set-option -w -g pane-border-format ' #{pane_index} #{pane_id} | #{?@aic_role,#{@aic_role},unassigned} | #{=28:pane_title} | #{?pane_dead,#[fg=colour214]DEAD #{?pane_dead_signal,signal=#{pane_dead_signal},exit=#{pane_dead_status}},#[fg=colour81]RUNNING}#[default] '
set-option -w -g window-status-format ' #I:#W#{?window_activity_flag, +,} '
set-option -w -g window-status-current-format '#[bg=colour24,fg=colour231,bold] #I:#W#{?window_zoomed_flag, Z,} #[default]'
set-option -g status-left-length 40
set-option -g status-left '#[fg=colour81,bold] AIC #S #[default]| '
set-option -g status-right-length 65
set-option -g status-right 'C-b w:tree  q:panes  z:zoom  d:detach | %H:%M '
set-option -g status-format[1] '#[bg=colour236,fg=colour252] #{pane_id} #{?@aic_role,#{@aic_role},unassigned} | #{?pane_dead,DEAD #{?pane_dead_signal,signal=#{pane_dead_signal},exit=#{pane_dead_status}},RUNNING #{pane_current_command}} | process state only; acceptance and evidence: task board #[default]'

# Keep the documented tmux 3.8 default prefix (Ctrl-b) and navigation bindings.
# Mouse is off so application clicks/Alt+A remain with the lead TUI by default.
set-option -g mouse off
