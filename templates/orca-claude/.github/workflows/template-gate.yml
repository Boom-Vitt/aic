name: Template gate
on:
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the project gate
        run: |
          if [ ! -x ./gate.sh ]; then
            echo "No executable gate.sh. Add the project's lint, typecheck, and test command before treating this workflow as acceptance."
            exit 0
          fi
          set +e
          ./gate.sh
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "gate.sh exited 2: no project check is configured yet. This skip is not a pass of lint, typecheck, or tests."
            exit 0
          fi
          exit "$code"
